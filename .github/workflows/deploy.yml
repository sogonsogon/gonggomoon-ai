name: Deploy AI Server to Private EC2

on:
  push:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      DEPLOY_DIR: /opt/ai-server

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy AI server" \
            --parameters commands='[
              "set -eux",
              "cd '"${{ env.DEPLOY_DIR }}"'",
              "pwd",
              "ls -al",
              "cat .env",
              "sed -i '\''s|^IMAGE_TAG=.*|IMAGE_TAG=${{ env.IMAGE_TAG }}|'\'' .env",
              "sed -i '\''s|^ECR_REGISTRY=.*|ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}|'\'' .env",
              "sed -i '\''s|^ECR_REPOSITORY=.*|ECR_REPOSITORY=${{ env.ECR_REPOSITORY }}|'\'' .env",
              "echo ===== ENV AFTER =====",
              "cat .env",
              "echo ===== DOCKER COMPOSE VERSION =====",
              "which docker-compose",
              "sudo docker-compose --version",
              "echo ===== AWS IDENTITY =====",
              "aws sts get-caller-identity",
              "echo ===== ECR LOGIN =====",
              "aws ecr get-login-password --region ${{ env.AWS_REGION }} | sudo docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
              "echo ===== DOCKER PULL LATEST =====",
              "sudo docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest",
              "echo ===== COMPOSE CONFIG =====",
              "sudo docker-compose -f docker-compose.prod.yml config",
              "echo ===== COMPOSE PULL =====",
              "sudo docker-compose -f docker-compose.prod.yml pull",
              "echo ===== COMPOSE UP =====",
              "sudo docker-compose -f docker-compose.prod.yml up -d",
              "echo ===== DOCKER PS =====",
              "sudo docker ps -a",
              "echo ===== DOCKER IMAGES =====",
              "sudo docker images",
              "echo ===== COMPOSE PS =====",
              "sudo docker-compose -f docker-compose.prod.yml ps"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          sleep 10

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.INSTANCE_ID }}" \
            --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json